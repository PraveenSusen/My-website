
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>404 | Page Not Found</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at top right, #12395a 0, transparent 35%),
        radial-gradient(circle at bottom left, #102a43 0, transparent 30%),
        #08111f;

      color: #e5e7eb;
    }

    .error-container {
      width: 100%;
      max-width: 700px;
      text-align: center;
    }

    .cloud {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .error-code {
      font-size: 120px;
      line-height: 1;
      font-weight: bold;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 34px;
      color: #ffffff;
      margin-bottom: 15px;
    }

    p {
      max-width: 550px;
      margin: 0 auto 30px;
      color: #9ca3af;
      font-size: 17px;
      line-height: 1.7;
    }

    .error-box {
      background: #111c2f;
      border: 1px solid #1f3048;
      border-radius: 14px;
      padding: 18px;
      margin: 30px auto;
      max-width: 500px;
      color: #9ca3af;
    }

    .error-box span {
      color: #38bdf8;
    }

    .home-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #38bdf8;
      color: #08111f;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }

    .home-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 30px rgba(56, 189, 248, 0.2);
    }

    .status {
      margin-top: 45px;
      color: #64748b;
      font-size: 14px;
    }

    .status-dot {
      color: #38bdf8;
    }

    @media (max-width: 600px) {
      .error-code {
        font-size: 90px;
      }

      h1 {
        font-size: 28px;
      }

      .cloud {
        font-size: 50px;
      }
    }
  </style>
</head>

<body>

  <div class="error-container">

    <div class="cloud">☁️</div>

    <div class="error-code">404</div>

    <h1>Page Not Found</h1>

    <p>
      Looks like this resource got lost in the cloud.
      The page you are looking for doesn't exist or may have been moved.
    </p>

    <div class="error-box">
      <span>ERROR:</span> Requested resource not found<br>
      <span>STATUS:</span> 404<br>
      <span>HOST:</span> Amazon S3
    </div>

    <a href="index.html" class="home-btn">
      ← Back to Home
    </a>

    <div class="status">
      <span class="status-dot">●</span>
      DevOps Portfolio • Hosted on Amazon S3
    </div>

  </div>

</body>
</html>
